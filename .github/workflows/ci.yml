name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine affected tasks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm ci:scope

      - name: Verify workspace task selection
        run: pnpm test:workspace

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Prepare test database
        if: steps.scope.outputs.api == 'true'
        run: |
          pnpm db:generate
          pnpm prisma validate
          pnpm prisma migrate deploy

      - name: Validate affected workspaces
        if: steps.scope.outputs.work == 'true'
        env:
          SCOPE_FILTER: ${{ steps.scope.outputs.filter }}
          INCLUDE_ADMIN: ${{ steps.scope.outputs.includeAdmin }}
        run: |
          args=()
          if [[ -n "$SCOPE_FILTER" ]]; then args+=("$SCOPE_FILTER"); fi
          if [[ "$INCLUDE_ADMIN" == "true" ]]; then args+=("--filter=@nove/admin"); fi
          pnpm exec turbo run lint lint:prisma format:check test build "${args[@]}" --concurrency=2

      - name: Prisma PostgreSQL compatibility tests
        if: steps.scope.outputs.api == 'true'
        run: pnpm --filter @nove/api exec jest --selectProjects integration --runInBand test/integration/prisma/prisma7.int-spec.ts

      - name: Set up Docker Buildx
        if: steps.scope.outputs.api == 'true' || steps.scope.outputs.admin == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Verify API image
        if: steps.scope.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Verify Admin image
        if: steps.scope.outputs.admin == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.admin
          push: false
          build-args: VITE_API_BASE_URL=https://api.example.invalid
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nove-admin</title>
    <script>
      /*
       * 首帧防闪：main.tsx 会先 await initializeAuth()（有 token 时是一次网络请求）
       * 才挂载 React，这段脚本在解析阶段就把底色和 color-scheme 定下来。
       * 读取的 key 与 app/providers/themeStore.ts 的 THEME_STORAGE_KEY 必须一致。
       */
      (function () {
        try {
          var stored = localStorage.getItem('nove-admin:theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
          root.style.backgroundColor = dark ? '#000000' : '#f5f5f5';
        } catch (error) {
          /* localStorage 不可用时保持浏览器默认，不阻塞启动 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
